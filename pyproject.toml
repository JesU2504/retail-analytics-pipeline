[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-pipeline"
version = "0.1.0"
description = "A reproducible retail ELT pipeline with DuckDB, dbt and data quality gates"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "dbt-core==1.10.15", "dbt-duckdb==1.10.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
retail = "retail_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
